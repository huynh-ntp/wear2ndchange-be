name: Deploy Spring Boot App

on:
  push:
    branches:
      - develop  # Thay bằng tên branch bạn muốn deploy nếu khác

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project with Maven
        run: ./mvnw clean package -DskipTests

      - name: Upload JAR to server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          source: "target/Wear2ndChange-0.0.1-SNAPSHOT.jar"
          target: "/root/"

      - name: Deploy app on server via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            echo "Killing process on port 8080 if exists..."
            lsof -ti:8080 | xargs -r kill -9

            echo "Starting new application..."
            nohup java -jar /root/Wear2ndChange-0.0.1-SNAPSHOT.jar > app.log 2>&1 &
